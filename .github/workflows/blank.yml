name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          set -euo pipefail
          echo "Workspace root: $(pwd)"
          echo "Top-level files:"
          ls -la

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          missing=0
          for path in "${required_files[@]}"; do
            if [ ! -f "$path" ]; then
              echo "ERROR: required file is missing: $path"
              missing=1
            else
              echo "OK: $path"
            fi
          done

          if [ ! -d "app/src/main/java" ]; then
            echo "ERROR: missing directory app/src/main/java"
            missing=1
          else
            echo "OK: app/src/main/java"
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "OK: Gradle Wrapper found"
          else
            echo "WARN: Gradle Wrapper is missing. CI will use Gradle 8.9 from setup-gradle."
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Project structure check failed."
            echo "The Android project must already be unpacked in the repository root."
            echo "Do not unpack a ZIP inside this workflow."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

          if [ -z "\( {ANDROID_HOME:-}" ] && [ -n " \){ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          sdkmanager --list_installed

      - name: Setup Gradle from Wrapper
        if: hashFiles('gradle/wrapper/gradle-wrapper.properties') != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle 8.9 without Wrapper
        if: hashFiles('gradlew') == ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -euo pipefail
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          echo "Expected APK path: $APK_PATH"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created at $APK_PATH"
            echo "Searching for other APK files:"
            find app/build/outputs -name "*.apk" -print || true
            exit 1
          fi

          SIZE="$(stat -c%s "$APK_PATH")"
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: APK exists but is empty or too small."
            exit 1
          fi

          echo "APK verified."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cold-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
