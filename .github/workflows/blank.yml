
name: Build COLD AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Завантаження репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Перевірка структури проєкту
      - name: Check project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Project files found."

      # 3. Налаштування Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Налаштування Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Прийняття ліцензій Android SDK
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 6. Встановлення потрібних компонентів SDK
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Налаштування Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Збірка APK
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # 9. Перевірка наявності APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      # 10. Збереження APK у GitHub Actions
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: COLD-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
